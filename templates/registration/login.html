{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="text-center mb-4">

    <img
        src="{% static 'images/logo.png' %}"
        height="90">

</div>

<div class="row justify-content-center">

    <div class="col-lg-5">

        <div class="card border-0 shadow-lg rounded-4">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <h2 class="fw-bold">

                        Вход в систему

                    </h2>

                    <p class="text-muted">

                        ООО «Победа Агро»

                    </p>

                </div>

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">

                            Логин

                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control form-control-lg">

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Пароль

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control form-control-lg">

                    </div>

                    <button
                        class="btn btn-success btn-lg w-100">

                        Войти

                    </button>

                </form>

                <hr>

                <div class="text-center">

                    Нет аккаунта?

                    <a href="{% url 'register' %}">

                        Зарегистрироваться

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
