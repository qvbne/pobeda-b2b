{% extends 'base.html' %}

{% block content %}

<h1 class="fw-bold mb-4">

Управление заказами

</h1>

<div class="card border-0 shadow">

<div class="card-body">

<table class="table table-hover">

<tr>

<th>Номер</th>
<th>Покупатель</th>
<th>Статус</th>
<th>Сумма</th>
<th></th>

</tr>

{% for order in orders %}

<tr>

<td>
{{ order.order_number }}
</td>

<td>
{{ order.buyer.username }}
</td>

<td>

<span class="badge bg-success">

{{ order.get_status_display }}

</span>

</td>

<td>

{{ order.total_amount }} ₽

</td>

<td>

<a
href="{% url 'change_order_status' order.id 'confirmed' %}"
class="btn btn-sm btn-success">

Подтвердить

</a>

<a
href="{% url 'change_order_status' order.id 'completed' %}"
class="btn btn-sm btn-primary">

Завершить

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</div>

{% endblock %}
